# CI para bandadau-admin: lint + typecheck + build por app (shell + mfe-moderation).
name: ci
on:
  push: { branches: [main, develop] }
  pull_request: {}
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { app: [shell, mfe-moderation] }
    steps:
      # Layout de hermanos: $GITHUB_WORKSPACE/{bandadau-admin,bandadau-shared,bandadau-docs} (ADR-0017).
      - uses: actions/checkout@v4
        with: { path: bandadau-admin }
      - uses: actions/checkout@v4
        with: { repository: '${{ github.repository_owner }}/bandadau-shared', path: bandadau-shared, token: '${{ secrets.CI_REPOS_TOKEN || github.token }}' }
      - uses: actions/checkout@v4
        with: { repository: '${{ github.repository_owner }}/bandadau-docs', path: bandadau-docs, token: '${{ secrets.CI_REPOS_TOKEN || github.token }}' }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: bandadau-shared/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - name: Construir bandadau-shared
        working-directory: bandadau-shared
        run: pnpm install --frozen-lockfile && pnpm build
      - name: ¿Hay código para ${{ matrix.app }}?
        id: detect
        run: echo "present=$([ -f bandadau-admin/${{ matrix.app }}/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        working-directory: bandadau-admin/${{ matrix.app }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm build
